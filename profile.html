<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAHEERAH ONE - Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #100b20;
  color: white;
}

header {
  background: #1d1235;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #d8aaff;
  font-size: 21px;
  font-weight: bold;
}

button {
  background: #a855f7;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 10px;
  cursor: pointer;
}

main {
  max-width: 600px;
  margin: 30px auto;
  padding: 18px;
}

.profile-card {
  background: #211735;
  border: 1px solid #65418c;
  border-radius: 18px;
  padding: 25px;
  text-align: center;
}

.avatar {
  width: 115px;
  height: 115px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #c084fc;
  background: #39265a;
}

h1 {
  color: #d8aaff;
}

label {
  display: block;
  text-align: left;
  margin: 17px 0 7px;
  color: #d8aaff;
}

input, textarea {
  width: 100%;
  padding: 13px;
  background: #100b20;
  border: 1px solid #65418c;
  border-radius: 9px;
  color: white;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.save {
  width: 100%;
  margin-top: 20px;
  font-size: 16px;
}

#message {
  margin: 15px 0;
  color: #d8aaff;
}

.back {
  display: inline-block;
  margin-bottom: 20px;
  color: #d8aaff;
  text-decoration: none;
}
</style>
</head>

<body>

<header>
  <div class="logo">TAHEERAH ONE</div>
  <button id="logout">Logout</button>
</header>

<main>

<a class="back" href="home.html">← Back to Home</a>

<section class="profile-card">

<img
id="avatar"
class="avatar"
src="https://placehold.co/150x150/39265a/ffffff?text=TO"
alt="Profile picture"
>

<h1>My Profile 👤</h1>

<p id="email">Loading account...</p>

<form id="profileForm">

<label>Full Name</label>
<input id="fullName" type="text" placeholder="Your full name">

<label>Username</label>
<input id="username" type="text" placeholder="Choose a username">

<label>Profile Picture URL</label>
<input id="avatarUrl" type="url" placeholder="Paste image URL">

<label>About Me / Bio</label>
<textarea id="bio" placeholder="Tell the world about yourself..."></textarea>

<button class="save" id="saveButton" type="submit">
Save Profile
</button>

</form>

<div id="message"></div>

</section>
</main>

<script>
const SUPABASE_URL =
"https://yfkmkjqtgaqbpvjfebog.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_nJb5URtJy3_LOsEeU4TvcA_JQ_T4uep";

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;

const message = document.getElementById("message");

async function loadProfile() {

  const { data, error } =
  await supabaseClient.auth.getSession();

  if (error || !data.session) {
    window.location.href = "auth.html";
    return;
  }

  currentUser = data.session.user;

  document.getElementById("email").textContent =
  currentUser.email || "";

  const { data: profile, error: profileError } =
  await supabaseClient
  .from("profiles")
  .select("*")
  .eq("id", currentUser.id)
  .maybeSingle();

  if (profileError) {
    message.textContent = profileError.message;
    return;
  }

  document.getElementById("fullName").value =
  profile?.full_name ||
  currentUser.user_metadata.full_name || "";

  document.getElementById("username").value =
  profile?.username || "";

  document.getElementById("avatarUrl").value =
  profile?.avatar_url || "";

  document.getElementById("bio").value =
  profile?.bio || "";

  if (profile?.avatar_url) {
    document.getElementById("avatar").src =
    profile.avatar_url;
  }
}

document.getElementById("avatarUrl")
.addEventListener("input", function() {
  const url = this.value.trim();

  if (url) {
    document.getElementById("avatar").src = url;
  }
});

document.getElementById("profileForm")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  if (!currentUser) return;

  const button = document.getElementById("saveButton");

  button.disabled = true;
  button.textContent = "Saving...";

  const fullName =
  document.getElementById("fullName").value.trim();

  const username =
  document.getElementById("username").value.trim();

  const avatarUrl =
  document.getElementById("avatarUrl").value.trim();

  const bio =
  document.getElementById("bio").value.trim();

  const { error } = await supabaseClient
  .from("profiles")
  .upsert({
    id: currentUser.id,
    full_name: fullName,
    username: username || null,
    avatar_url: avatarUrl || null,
    bio: bio
  }, {
    onConflict: "id"
  });

  button.disabled = false;
  button.textContent = "Save Profile";

  if (error) {
    message.textContent = "Error: " + error.message;
    return;
  }

  message.textContent =
  "Your profile has been saved successfully! 🎉💜";
});

document.getElementById("logout")
.addEventListener("click", async function() {
  await supabaseClient.auth.signOut();
  window.location.href = "auth.html";
});

loadProfile();
</script>

</body>
</html>
