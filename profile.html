<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TAHEERAH ONE - Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #100b20;
  color: white;
}

header {
  background: #1d1235;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #d8aaff;
  font-size: 21px;
  font-weight: bold;
}

button {
  background: #a855f7;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 10px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

main {
  max-width: 600px;
  margin: 30px auto;
  padding: 18px;
}

.profile-card {
  background: #211735;
  border: 1px solid #65418c;
  border-radius: 18px;
  padding: 25px;
  text-align: center;
}

.avatar {
  width: 125px;
  height: 125px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #c084fc;
  background: #39265a;
}

h1 {
  color: #d8aaff;
}

label {
  display: block;
  text-align: left;
  margin: 17px 0 7px;
  color: #d8aaff;
}

input, textarea {
  width: 100%;
  padding: 13px;
  background: #100b20;
  border: 1px solid #65418c;
  border-radius: 9px;
  color: white;
}

input[type="file"] {
  padding: 10px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.save {
  width: 100%;
  margin-top: 20px;
  font-size: 16px;
}

.upload-button {
  width: 100%;
  margin-top: 12px;
}

#message {
  margin: 15px 0;
  color: #d8aaff;
  overflow-wrap: anywhere;
}

.back {
  display: inline-block;
  margin-bottom: 20px;
  color: #d8aaff;
  text-decoration: none;
}
</style>
</head>

<body>

<header>
  <div class="logo">TAHEERAH ONE</div>
  <button id="logout">Logout</button>
</header>

<main>

<a class="back" href="home.html">← Back to Home</a>

<section class="profile-card">

<img
id="avatar"
class="avatar"
src="https://placehold.co/150x150/39265a/ffffff?text=TO"
alt="Profile picture"
>

<h1>My Profile 👤</h1>

<p id="email">Loading account...</p>

<div>
  <label>Choose Profile Picture</label>

  <input
  type="file"
  id="profileImage"
  accept="image/*"
  >

  <button
  type="button"
  class="upload-button"
  id="uploadButton">
  Upload Picture 📸
  </button>
</div>

<form id="profileForm">

<label>Full Name</label>
<input id="fullName" type="text" placeholder="Your full name">

<label>Username</label>
<input id="username" type="text" placeholder="Choose a username">

<label>Profile Picture URL</label>
<input id="avatarUrl" type="url" placeholder="Your uploaded picture URL">

<label>About Me / Bio</label>
<textarea id="bio" placeholder="Tell the world about yourself..."></textarea>

<button class="save" id="saveButton" type="submit">
Save Profile
</button>

</form>

<div id="message"></div>

</section>
</main>

<script>

const SUPABASE_URL =
"https://yfkmkjqtgaqbpvjfebog.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_nJb5URtJy3_LOsEeU4TvcA_JQ_T4uep";

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;

const message = document.getElementById("message");

async function loadProfile() {

  const { data, error } =
  await supabaseClient.auth.getSession();

  if (error || !data.session) {
    window.location.href = "auth.html";
    return;
  }

  currentUser = data.session.user;

  document.getElementById("email").textContent =
  currentUser.email || "";

  const { data: profile, error: profileError } =
  await supabaseClient
  .from("profiles")
  .select("*")
  .eq("id", currentUser.id)
  .maybeSingle();

  if (profileError) {
    message.textContent = profileError.message;
    return;
  }

  document.getElementById("fullName").value =
  profile?.full_name ||
  currentUser.user_metadata.full_name || "";

  document.getElementById("username").value =
  profile?.username || "";

  document.getElementById("avatarUrl").value =
  profile?.avatar_url || "";

  document.getElementById("bio").value =
  profile?.bio || "";

  if (profile?.avatar_url) {
    document.getElementById("avatar").src =
    profile.avatar_url;
  }
}

// Preview selected picture

document.getElementById("profileImage")
.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    message.textContent = "Please select an image.";
    this.value = "";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    message.textContent = "Image must be smaller than 5 MB.";
    this.value = "";
    return;
  }

  const previewURL = URL.createObjectURL(file);

  document.getElementById("avatar").src = previewURL;

  message.textContent = "Picture selected! Ready to upload. 💜";
});

// Upload picture to Supabase Storage

document.getElementById("uploadButton")
.addEventListener("click", async function() {

  if (!currentUser) return;

  const fileInput = document.getElementById("profileImage");
  const file = fileInput.files[0];

  if (!file) {
    message.textContent = "Please choose a picture first.";
    return;
  }

  const button = this;

  button.disabled = true;
  button.textContent = "Uploading...";

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

  const filePath =
  currentUser.id + "/" + Date.now() + "-" + safeName;

  const { error: uploadError } =
  await supabaseClient.storage
  .from("profile-pictures")
  .upload(filePath, file, {
    cacheControl: "3600",
    upsert: false
  });

  if (uploadError) {

    message.textContent =
    "Upload error: " + uploadError.message;

    button.disabled = false;
    button.textContent = "Upload Picture 📸";

    return;
  }

  const { data: publicData } =
  supabaseClient.storage
  .from("profile-pictures")
  .getPublicUrl(filePath);

  const imageURL = publicData.publicUrl;

  document.getElementById("avatar").src = imageURL;

  document.getElementById("avatarUrl").value = imageURL;

  const { error: saveError } =
  await supabaseClient
  .from("profiles")
  .upsert({
    id: currentUser.id,
    avatar_url: imageURL
  }, {
    onConflict: "id"
  });

  button.disabled = false;
  button.textContent = "Upload Picture 📸";

  if (saveError) {
    message.textContent =
    "Picture uploaded, but profile save failed: " +
    saveError.message;
    return;
  }

  message.textContent =
  "Profile picture uploaded successfully! 🎉💜";

  fileInput.value = "";

});

// Preview image URL

document.getElementById("avatarUrl")
.addEventListener("input", function() {

  const url = this.value.trim();

  if (url) {
    document.getElementById("avatar").src = url;
  }

});

// Save profile information

document.getElementById("profileForm")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  if (!currentUser) return;

  const button = document.getElementById("saveButton");

  button.disabled = true
  
button.textContent = "Saving...";

const { error } = await supabaseClient
  .from("profiles")
  .upsert({
    id: currentUser.id,
    full_name: document.getElementById("fullName").value.trim(),
    username: document.getElementById("username").value.trim(),
    avatar_url: document.getElementById("avatarUrl").value.trim(),
    bio: document.getElementById("bio").value.trim()
  }, {
    onConflict: "id"
  });

button.disabled = false;
button.textContent = "Save Profile";

if (error) {
  message.textContent = "Save error: " + error.message;
  return;
}

message.textContent = "Your profile has been saved successfully! 🎉💜";

});

loadProfile();

</script>
</body>
</html>
