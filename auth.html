<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAHEERAH ONE | Create. Connect. Explore.</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 15% 20%, #54258c 0%, transparent 35%),
        radial-gradient(circle at 85% 80%, #32105d 0%, transparent 35%),
        linear-gradient(135deg, #090513, #170b29, #090513);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 440px;
    padding: 35px 28px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 25px;
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.logo span {
    color: #d6a6ff;
}

.tagline {
    text-align: center;
    color: #d7d4e7;
    font-size: 13px;
    margin-bottom: 30px;
}

.tabs {
    display: flex;
    gap: 8px;
    background: rgba(0,0,0,0.25);
    padding: 5px;
    border-radius: 12px;
    margin-bottom: 25px;
}

.tabs button {
    width: 50%;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.tabs button.active {
    background: #b77cff;
    color: #17112a;
}

h2 {
    text-align: center;
    margin-bottom: 22px;
}

.input-group {
    margin-bottom: 17px;
}

.input-group label {
    display: block;
    font-size: 13px;
    margin-bottom: 8px;
    color: #e3d8f5;
}

.input-group input {
    width: 100%;
    padding: 14px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    color: white;
    outline: none;
    font-size: 15px;
}

.input-group input:focus {
    border-color: #c18bff;
}

.input-group input::placeholder {
    color: #b9afc9;
}

.main-btn {
    width: 100%;
    padding: 15px;
    margin-top: 8px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(90deg, #a855f7, #d8a4ff);
    color: #180d27;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.main-btn:disabled {
    opacity: 0.6;
    cursor: wait;
}

.message {
    margin-top: 17px;
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.footer {
    text-align: center;
    color: #aaa0bd;
    font-size: 11px;
    margin-top: 25px;
}

.hidden {
    display: none;
}

@media(max-width: 480px) {
    body {
        padding: 15px;
    }

    .container {
        padding: 30px 20px;
    }

    .logo {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">TAHEERAH <span>ONE</span></div>

    <p class="tagline">
        Create once. Connect everywhere.
    </p>

    <div class="tabs">
        <button id="signupTab" class="active" onclick="showSignup()">
            Sign Up
        </button>

        <button id="loginTab" onclick="showLogin()">
            Login
        </button>
    </div>

    <form id="signupForm">
        <h2>Create Your Account</h2>

        <div class="input-group">
            <label>Full Name</label>
            <input id="fullName" type="text"
            placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input id="signupEmail" type="email"
            placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input id="signupPassword" type="password"
            placeholder="Create a password" minlength="6" required>
        </div>

        <button class="main-btn" id="signupButton" type="submit">
            Create Account
        </button>
    </form>

    <form id="loginForm" class="hidden">
        <h2>Welcome Back</h2>

        <div class="input-group">
            <label>Email Address</label>
            <input id="loginEmail" type="email"
            placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input id="loginPassword" type="password"
            placeholder="Enter your password" required>
        </div>

        <button class="main-btn" id="loginButton" type="submit">
            Login to TAHEERAH ONE
        </button>
    </form>

    <div id="message" class="message"></div>

    <div class="footer">
        © 2026 TAHEERAH ONE. All rights reserved.
    </div>

</div>

<script>
const SUPABASE_URL =
"https://yfkmkjqtgaqbpvjfebog.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

const signupForm = document.getElementById("signupForm");
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

function showSignup() {
    signupForm.classList.remove("hidden");
    loginForm.classList.add("hidden");

    document.getElementById("signupTab").classList.add("active");
    document.getElementById("loginTab").classList.remove("active");

    message.textContent = "";
}

function showLogin() {
    loginForm.classList.remove("hidden");
    signupForm.classList.add("hidden");

    document.getElementById("loginTab").classList.add("active");
    document.getElementById("signupTab").classList.remove("active");

    message.textContent = "";
}

signupForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = document.getElementById("signupButton");
    button.disabled = true;
    button.textContent = "Creating account...";

    message.textContent = "";

    try {
        const fullName = document.getElementById("fullName").value;
        const email = document.getElementById("signupEmail").value;
        const password = document.getElementById("signupPassword").value;

        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    full_name: fullName
                },
                emailRedirectTo:
                "https://shehufatima3131.github.io/Taheerah-Technology-/auth.html"
            }
        });

        if (error) throw error;

        message.textContent =
        "Account request successful! Please check your email for confirmation.";

    } catch (error) {
        message.textContent = error.message;
    }

    button.disabled = false;
    button.textContent = "Create Account";
});

loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = document.getElementById("loginButton");
    button.disabled = true;
    button.textContent = "Logging in...";

    message.textContent = "";

    try {
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) throw error;

        message.textContent = "Welcome to TAHEERAH ONE! Login successful.";

    } catch (error) {
        message.textContent = error.message;
    }

    button.disabled = false;
    button.textContent = "Login to TAHEERAH ONE";
});
</script>

</body>
</html>
