<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAHEERAH ONE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #100d19;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 25px 10px;
    }

    h1 {
      color: #c69aff;
      font-size: 30px;
    }

    .tagline {
      color: #c8c1d2;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 25px;
      background: #211a2e;
      border-radius: 18px;
      text-align: center;
    }

    #status {
      color: #c69aff;
      line-height: 1.6;
    }

    textarea,
input[type="file"] {
  width: 100%;
  margin-top: 10px;
  color: white;
}

textarea {
  background: #100d19;
  color: white;
  border: 1px solid #8c65bd;
  border-radius: 12px;
  resize: vertical;
}

button {
  background: #a66bea;
  color: white;
  border: none;
  padding: 13px 22px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.post {
  background: #100d19;
  padding: 15px;
  margin-top: 15px;
  border-radius: 12px;
  text-align: left;
}

.post img,
.post video {
  width: 100%;
  border-radius: 12px;
  margin-top: 10px;
}
  </style>
</head>

<body>

  <header>
    <h1>TAHEERAH ONE</h1>
    <p class="tagline">Create once. Connect everywhere.</p>
  </header>

  <div class="container">
    <h2>Welcome to TAHEERAH ONE 🌍</h2>
    <p id="status">Connecting to your account...</p>
  </div>

  <div class="container">
  <h2>Create a Post ✨</h2>

  <textarea
    id="caption"
    placeholder="What's on your mind?"
    style="width:100%; min-height:100px; padding:12px;">
  </textarea>

  <br><br>

  <input
    type="file"
    id="postMedia"
    accept="image/*,video/*">

  <br><br>

  <button id="postButton">Publish Post</button>

  <p id="message"></p>
</div>

<div class="container">
  <h2>Explore Posts 🌍</h2>
  <div id="feed"></div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://yfkmkjqtgaqbpvjfebog.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_nJb5URtJy3_LOsEeU4TvcA_JQ_T4uep";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function startApp() {
      const status = document.getElementById("status");

      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          window.location.href = "auth.html";
          return;
        }

        const user = data.session.user;

        const name =
          user.user_metadata.full_name || "Member";

        status.textContent =
          "Welcome, " + name + "! Your account is connected. 💜";

      } catch (error) {
        status.textContent =
          "Connection error: " + error.message;
      }
    }

    startApp();
  </script>

</body>
</html>
