<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAHEERAH ONE - Home</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #100b20;
  color: white;
}

header {
  padding: 20px;
  background: #1d1235;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #39265a;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: #d8aaff;
}

button {
  border: none;
  padding: 11px 17px;
  border-radius: 10px;
  background: #a855f7;
  color: white;
  cursor: pointer;
}

main {
  max-width: 650px;
  margin: 25px auto;
  padding: 15px;
}

.welcome {
  margin-bottom: 25px;
}

.welcome h1 {
  color: #d8aaff;
}

.create-post, .post {
  background: #211735;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
  border: 1px solid #39265a;
}

textarea {
  width: 100%;
  min-height: 100px;
  padding: 15px;
  border-radius: 10px;
  background: #100b20;
  color: white;
  border: 1px solid #65418c;
  resize: vertical;
  margin-bottom: 12px;
}

.post small {
  color: #c5a6e8;
}

.post p {
  line-height: 1.6;
  overflow-wrap: anywhere;
}

#message {
  color: #d8aaff;
  margin: 15px 0;
}

nav {
  display: flex;
  justify-content: space-around;
  padding: 18px;
  background: #1d1235;
  position: sticky;
  bottom: 0;
}

nav span {
  color: #d8aaff;
  font-size: 14px;
}

</style>
  <style>

.post img {
  display: block;
  width: 100%;
  height: 280px;
  object-fit: cover;
  object-position: center;
  border-radius: 12px;
  margin-top: 12px;
}

.post video {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
  margin-top: 12px;
}
    .stories-section {
  padding: 15px;
  margin: 15px 0;
  background: #ffffff;
  border-radius: 15px;
}

.stories-container {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding: 10px 0;
}

.story-item {
  min-width: 70px;
  text-align: center;
}

.add-story {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  border: 3px solid #8b5cf6;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.add-story span {
  font-size: 25px;
  color: #8b5cf6;
}

.add-story small {
  font-size: 9px;
}

#uploadStory {
  background: #6b21a8;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 20px;
  margin-top: 10px;

}
    .story-viewer {
  display: none;
  position: fixed;
  z-index: 9999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  align-items: center;
  justify-content: center;
}

.story-viewer img,
.story-viewer video {
  max-width: 100%;
  max-height: 90%;
  object-fit: contain;
}

#closeStory {
  position: absolute;
  top: 20px;
  right: 25px;
  color: white;
  font-size: 40px;
  cursor: pointer;
  z-index: 10000;
}

</style>
</head>

<body>

  <!-- TAHEERAH ONE STORIES -->

<section class="stories-section">

  <h3>Stories 🌍💜</h3>

  <div class="stories-container" id="storiesContainer">

    <div class="story-item">
      <label for="storyFile" class="add-story">
        <span>＋</span>
        <small>Add Story</small>
      </label>
    </div>

  </div>

  <input
    type="file"
    id="storyFile"
    accept="image/*,video/*"
    hidden
  >

  <button id="uploadStory">Share Story</button>

  <p id="storyMessage"></p>
  
  <div id="storyViewer" class="story-viewer">

  <span id="closeStory">&times;</span>

  <img id="fullStoryImage" src="" style="display:none;">

  <video id="fullStoryVideo" controls style="display:none;"></video>

</div>

</section>

<!-- END STORIES -->




<header>
  <div class="logo">TAHEERAH ONE</div>
  <button id="logout">Logout</button>
</header>

<main>

  <section class="welcome">
    <h1>Welcome to TAHEERAH ONE 💜</h1>
    <p>Create once. Connect everywhere.</p>
    <p id="username">Welcome, member!</p>
  </section>

  <section class="create-post">
    <h3>What's happening?</h3>

    <form id="postForm">
      <textarea id="caption"
      placeholder="Share something with the world..."></textarea>
      <label for="postMedia">Add Photo or Video 📸🎥</label>

<input
  type="file"
  id="postMedia"
  accept="image/*,video/*"
>

      <button type="submit" id="postButton">
        Publish Post
      </button>
    </form>
  </section>

  <h2>🌍 Your Feed</h2>

  <div id="message"></div>
  <section id="feed"></section>

</main>

<nav>
  <span>🏠 Home</span>
  <span>🔍 Explore</span>
  <span>➕ Create</span>
  <span>🔔 Alerts</span>
  <span>👤 Profile</span>
</nav>

<script>
const SUPABASE_URL = "https://yfkmkjqtgaqbpvjfebog.supabase.co";

const SUPABASE_PUBLISHABLE_KEY = " sb_publishable_nJb5URtJy3_LOsEeU4TvcA_JQ_T4uep";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;

const message = document.getElementById("message");
const feed = document.getElementById("feed");

async function startApp() {
  const { data, error } = await supabaseClient.auth.getSession();

  if (error || !data.session) {
    window.location.href = "auth.html";
    return;
  }

  currentUser = data.session.user;

  document.getElementById("username").textContent =
    "Welcome, " + (currentUser.user_metadata.full_name || "Member") + "!";

  loadPosts();
}

async function loadPosts() {
  message.textContent = "Loading posts...";

  const { data, error } = await supabaseClient
    .from("posts")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    message.textContent = "Could not load posts: " + error.message;
    return;
  }

  feed.innerHTML = "";

  if (!data || data.length === 0) {
    message.textContent = "No posts yet. Be the first to share something! 💜";
    return;
  }

  message.textContent = "";

  data.forEach(post => {
    const card = document.createElement("article");
    card.className = "post";

    const author = document.createElement("small");
    author.textContent = "TAHEERAH ONE Member";

    card.appendChild(author);

    if (post.caption) {
      const caption = document.createElement("p");
      caption.textContent = post.caption;
      card.appendChild(caption);
    }

    if (post.media_url) {
      let media;

      const isVideo = post.media_type === "video";

      if (isVideo) {
        media = document.createElement("video");
        media.controls = true;
        media.playsInline = true;
      } else {
        media = document.createElement("img");
        media.alt = "TAHEERAH ONE post";
      }

      media.src = post.media_url;
      media.style.maxWidth = "100%";
      media.style.borderRadius = "12px";

      card.appendChild(media);
    }

    const date = document.createElement("small");
    date.textContent = new Date(post.created_at).toLocaleString();

    card.appendChild(date);
    feed.appendChild(card);
  });
}


document.getElementById("postForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const caption = document.getElementById("caption").value.trim();
  const mediaFile = document.getElementById("postMedia").files[0];

  if (!caption && !mediaFile) {
    message.textContent = "Please write text or select a photo/video.";
    return;
  }

  const button = document.getElementById("postButton");
  button.disabled = true;
  button.textContent = "Publishing...";

  try {
    let mediaURL = null;
    let mediaType = null;

    if (mediaFile) {
      if (
        !mediaFile.type.startsWith("image/") &&
        !mediaFile.type.startsWith("video/")
      ) {
        throw new Error("Please select an image or video.");
      }

      if (mediaFile.size > 50 * 1024 * 1024) {
        throw new Error("File must be smaller than 50 MB.");
      }

      const safeName = mediaFile.name.replace(/[^a-zA-Z0-9._-]/g, "_");

      const filePath =
        currentUser.id + "/" + Date.now() + "-" + safeName;

      const { error: uploadError } = await supabaseClient
        .storage
        .from("post-media")
        .upload(filePath, mediaFile);

      if (uploadError) throw uploadError;

      const { data: urlData } = supabaseClient
        .storage
        .from("post-media")
        .getPublicUrl(filePath);

      mediaURL = urlData.publicUrl;

      mediaType = mediaFile.type.startsWith("video/")
        ? "video"
        : "image";
    }

    const { error } = await supabaseClient
      .from("posts")
      .insert({
        user_id: currentUser.id,
        caption: caption,
        media_url: mediaURL,
        media_type: mediaType
      });

    if (error) throw error;

    document.getElementById("caption").value = "";
    document.getElementById("postMedia").value = "";

    message.textContent = "Your post has been published! 🎉💜";

    await loadPosts();

  } catch (error) {
    message.textContent = "Error: " + error.message;

  } finally {
    button.disabled = false;
    button.textContent = "Publish Post";
  }
});


document.getElementById("logout").addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  window.location.href = "auth.html";
});
// TAHEERAH ONE STORIES

  let allStories = [];
let currentStoryIndex = 0;
let storyTimer = null;

const storyFile = document.getElementById("storyFile");
const uploadStoryButton = document.getElementById("uploadStory");
const storiesContainer = document.getElementById("storiesContainer");
const storyMessage = document.getElementById("storyMessage");

// Load active stories

  function showStory(index) {

  if (index >= allStories.length) {
    document.getElementById("storyViewer").style.display = "none";
    return;
  }

  clearTimeout(storyTimer);

  currentStoryIndex = index;

  const story = allStories[index];

  const viewer = document.getElementById("storyViewer");
  const fullImage = document.getElementById("fullStoryImage");
  const fullVideo = document.getElementById("fullStoryVideo");
  const progressBar = document.getElementById("storyProgressBar");

  viewer.style.display = "flex";

  fullVideo.pause();
  fullVideo.src = "";
  fullImage.src = "";

  fullImage.style.display = "none";
  fullVideo.style.display = "none";

  progressBar.style.transition = "none";
  progressBar.style.width = "0%";

  if (story.media_type.startsWith("video/")) {

    fullVideo.src = story.media_url;
    fullVideo.style.display = "block";

    fullVideo.onended = function() {
      showStory(index + 1);
    };

    fullVideo.play();

  } else {

    fullImage.src = story.media_url;
    fullImage.style.display = "block";

    setTimeout(() => {
      progressBar.style.transition = "width 5s linear";
      progressBar.style.width = "100%";
    }, 50);

    storyTimer = setTimeout(() => {
      showStory(index + 1);
    }, 5000);

  }

}

async function loadStories() {

  const { data, error } = await supabaseClient
    .from("stories")
    .select("*")
    .gt("expires_at", new Date().toISOString())
    .order("created_at", { ascending: false });

  if (error) {
    storyMessage.textContent = error.message;
    return;
  }

  allStories = data || [];
  
  const addStoryItem = storiesContainer.querySelector(".story-item");

storiesContainer.innerHTML = "";

if (addStoryItem) {
  storiesContainer.appendChild(addStoryItem);
}

  data.forEach(function(story) {

    const item = document.createElement("div");
    item.className = "story-item";

    if (story.media_type.startsWith("video/")) {

      item.innerHTML = `
        <video src="${story.media_url}"
        controls width="100" height="100"></video>
      `;

    } else {

      item.innerHTML = `
        <img src="${story.media_url}"
        width="100" height="100"
        style="object-fit:cover;border-radius:50%;">
      `;

    }



  item.addEventListener("click", function() {

  currentStoryIndex = allStories.indexOf(story);

  showStory(currentStoryIndex);

});

    storiesContainer.appendChild(item);

  });

}

// Upload story

uploadStoryButton.addEventListener("click", async function() {

  const file = storyFile.files[0];

  if (!file) {
    storyMessage.textContent = "Please choose a photo or video.";
    return;
  }

  if (!file.type.startsWith("image/") &&
      !file.type.startsWith("video/")) {
    storyMessage.textContent = "Choose an image or video.";
    return;
  }

  if (file.size > 50 * 1024 * 1024) {
    storyMessage.textContent = "File must be below 50 MB.";
    return;
  }

  uploadStoryButton.disabled = true;
  uploadStoryButton.textContent = "Uploading...";

  try {
    storyMessage.textContent = "Checking your account...";
    const { data: userData, error: userError } =
      await supabaseClient.auth.getUser();

    if (userError || !userData.user) {
      throw new Error("Please log in first.");
    }

    const user = userData.user;

    const filePath = user.id + "/" + Date.now() + "_" + file.name;

    const { error: uploadError } = await supabaseClient
      .storage
      .from("story-media")
      .upload(filePath, file);
    
  if (uploadError) throw uploadError;
storyMessage.textContent = "Photo uploaded. Saving story...";

    const { data: urlData } = supabaseClient
      .storage
      .from("story-media")
      .getPublicUrl(filePath);
    
    storyMessage.textContent = "Saving story to database...";

    const { error: insertError } = await supabaseClient
      .from("stories")
      .insert({
        user_id: user.id,
        media_url: urlData.publicUrl,
        media_type: file.type
      });

    if (insertError) throw insertError;
    
    
    
    storyMessage.textContent = "Your Story has been shared! 🎉💜";

    storyFile.value = "";

    await loadStories();

  } catch (error) {

    storyMessage.textContent = "Error: " + error.message;

  } finally {

    uploadStoryButton.disabled = false;
    uploadStoryButton.textContent = "Share Story";

  }

});

loadStories();

  

document.getElementById("closeStory").addEventListener("click", function() {

  const viewer = document.getElementById("storyViewer");
  const fullImage = document.getElementById("fullStoryImage");
  const fullVideo = document.getElementById("fullStoryVideo");
  clearTimeout(storyTimer);

  fullVideo.pause();
  fullVideo.onended = null;
  fullVideo.src = "";
  fullImage.src = "";
END TAHEERAH ONE STORIES.
  viewer.style.display = "none";

});

// END TAHEERAH ONE STORIES
startApp();
</script>

</body>
</html>
