<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAHEERAH ONE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #100d19;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 25px 10px;
    }

    h1 {
      color: #c69aff;
      font-size: 30px;
    }

    .tagline {
      color: #c8c1d2;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 25px;
      background: #211a2e;
      border-radius: 18px;
      text-align: center;
    }

    #status {
      color: #c69aff;
      line-height: 1.6;
    }

    textarea,
input[type="file"] {
  width: 100%;
  margin-top: 10px;
  color: white;
}

textarea {
  background: #100d19;
  color: white;
  border: 1px solid #8c65bd;
  border-radius: 12px;
  resize: vertical;
}

button {
  background: #a66bea;
  color: white;
  border: none;
  padding: 13px 22px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.post {
  background: #100d19;
  padding: 15px;
  margin-top: 15px;
  border-radius: 12px;
  text-align: left;
}

.post img,
.post video {
  width: 100%;
  max-height: 450px;
  object-fit: contain;
  display: block;
  border-radius: 12px;
  margin-top: 10px;
  background: #100d19;
}
  </style>
</head>

<body>

  <header>
    <h1>TAHEERAH ONE</h1>
    <p class="tagline">Create once. Connect everywhere.</p>
  </header>

  <div class="container">
    <h2>Welcome to TAHEERAH ONE 🌍</h2>
    <p id="status">Connecting to your account...</p>
  </div>

  <div class="container">
  <h2>Create a Post ✨</h2>

  <textarea
    id="caption"
    placeholder="What's on your mind?"
    style="width:100%; min-height:100px; padding:12px;">
  </textarea>

  <br><br>

  <input
    type="file"
    id="postMedia"
    accept="image/*,video/*">

  <br><br>

  <button id="postButton">Publish Post</button>

  <p id="message"></p>
</div>

<div class="container">
  <h2>Explore Posts 🌍</h2>
  <div id="feed"></div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://yfkmkjqtgaqbpvjfebog.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_nJb5URtJy3_LOsEeU4TvcA_JQ_T4uep";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );
          let currentUser = null;

    async function loadPosts() {
  const feed = document.getElementById("feed");

  feed.innerHTML = "Loading posts...";

  const { data, error } = await supabaseClient
    .from("posts")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    feed.textContent = "Error loading posts: " + error.message;
    return;
  }

  feed.innerHTML = "";

  data.forEach(function(post) {
    const card = document.createElement("div");
    card.className = "post";
    
const author = document.createElement("div");

const profile = Array.isArray(post.profiles)
  ? post.profiles[0]
  : post.profiles;

author.innerHTML = `
  <strong>${profile?.full_name || "Member"}</strong><br>
  <span>@${profile?.username || "user"}</span>
`;

card.appendChild(author);
    

    const caption = document.createElement("p");
    caption.textContent = post.caption || "";
    card.appendChild(caption);

    if (post.media_url) {
      let media;

      if (post.media_type === "video") {
        media = document.createElement("video");
        media.controls = true;
        media.playsInline = true;
      } else {
        media = document.createElement("img");
        media.alt = "TAHEERAH ONE post";
      }

      media.src = post.media_url;
      card.appendChild(media);
    }

    feed.appendChild(card);
  });
}
    async function startApp() {
      const status = document.getElementById("status");

      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          window.location.href = "auth.html";
          return;
        }

        const user = data.session.user;
       currentUser = user; 

        const name =
          user.user_metadata.full_name || "Member";

        status.textContent =
      
          "Welcome, " + name + "! Your account is connected. 💜";
        
        await loadPosts();
  
      } catch (error) {
        status.textContent =
          "Connection error: " + error.message;
      }
    }

    document.getElementById("postButton").addEventListener("click", async function() {
  const caption = document.getElementById("caption").value.trim();
  const mediaFile = document.getElementById("postMedia").files[0];
  const message = document.getElementById("message");

  if (!currentUser) {
    message.textContent = "Please log in first.";
    return;
  }

  if (!caption && !mediaFile) {
    message.textContent = "Write something or choose a photo/video.";
    return;
  }

  message.textContent = "Publishing your post...";

        try {
    let mediaURL = null;
    let mediaType = null;

    if (mediaFile) {
      const safeName = mediaFile.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const filePath = currentUser.id + "/" + Date.now() + "-" + safeName;

      const { error: uploadError } = await supabaseClient
        .storage.from("post-media")
        .upload(filePath, mediaFile);

      if (uploadError) throw uploadError;

      const { data: urlData } = supabaseClient
        .storage.from("post-media")
        .getPublicUrl(filePath);

      mediaURL = urlData.publicUrl;
      mediaType = mediaFile.type.startsWith("video/") ? "video" : "image";
    }

    const { error } = await supabaseClient
      .from("posts")
      .insert({
        user_id: currentUser.id,
        caption: caption,
        media_url: mediaURL,
        media_type: mediaType
      });

    if (error) throw error;

    document.getElementById("caption").value = "";
    document.getElementById("postMedia").value = "";

    message.textContent = "Your post has been published! 🎉💜";

          await loadPosts();

  } catch (error) {
    message.textContent = "Error: " + error.message;
  }
});

    startApp();
  </script>

</body>
</html>
