<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAHEERAH ONE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #100d19;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 25px 10px;
    }

    h1 {
      color: #c69aff;
      font-size: 30px;
    }

    .tagline {
      color: #c8c1d2;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 25px;
      background: #211a2e;
      border-radius: 18px;
      text-align: center;
    }

    #status {
      color: #c69aff;
      line-height: 1.6;
    }

    textarea,
input[type="file"] {
  width: 100%;
  margin-top: 10px;
  color: white;
}

textarea {
  background: #100d19;
  color: white;
  border: 1px solid #8c65bd;
  border-radius: 12px;
  resize: vertical;
}

button {
  background: #a66bea;
  color: white;
  border: none;
  padding: 13px 22px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.post {
  background: #100d19;
  padding: 15px;
  margin-top: 15px;
  border-radius: 12px;
  text-align: left;
}

.post img,
.post video {
  width: 100%;
  max-height: 450px;
  object-fit: contain;
  display: block;
  border-radius: 12px;
  margin-top: 10px;
  background: #100d19;
}
    .notification-link {
  display: inline-block;
  margin-top: 18px;
  padding: 12px 25px;
  background: linear-gradient(135deg, #a66bea, #7542a8);
  color: white;
  text-decoration: none;
  border-radius: 25px;
  font-weight: bold;
  border: 1px solid #d8b5ff;
  box-shadow: 0 4px 15px rgba(166, 107, 234, 0.3);
  transition: 0.3s;
}

.notification-link:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(166, 107, 234, 0.5);
}
    
  </style>
</head>

<body>

  <header>
    <h1>TAHEERAH ONE</h1>
    <p class="tagline">Create once. Connect everywhere.</p>
    <a href="notifications.html" class="notification-link">
  🔔 Notifications
</a>
  </header>
  
        <div class="container">
  <h2>🔍 Find Members</h2>

  <input
    type="text"
    id="searchMembersInput"
    placeholder="Search by name or username..."
  >

  <div id="memberSearchResults"></div>
</div>
  
  <div class="container">
    <h2>Welcome to TAHEERAH ONE 🌍</h2>
    <p id="status">Connecting to your account...</p>
  </div>

  <div class="container">
  <h2>Create a Post ✨</h2>

  <textarea
    id="caption"
    placeholder="What's on your mind?"
    style="width:100%; min-height:100px; padding:12px;">
  </textarea>

  <br><br>

  <input
    type="file"
    id="postMedia"
    accept="image/*,video/*">

  <br><br>

  <button id="postButton">Publish Post</button>

  <p id="message"></p>
</div>

  <div class="container">
  <h2>TAHEERAH ONE STORIES 🌍💜</h2>

  <p>Share your moments with the world!</p>

  <input
    type="file"
    id="storyMedia"
    accept="image/*,video/*">

  <br><br>

  <button id="storyButton">
    ✨ Add Story
  </button>

  <p id="storyMessage"></p>

  <div id="storiesFeed"></div>
</div>
<div class="container">
  <h2>Explore Posts 🌍</h2>
  <div id="feed"></div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://yfkmkjqtgaqbpvjfebog.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_nJb5URtJy3_LOsEeU4TvcA_JQ_T4uep";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );
          let currentUser = null;

    async function loadPosts() {
  const feed = document.getElementById("feed");

  feed.innerHTML = "Loading posts...";

  const { data, error } = await supabaseClient
    .from("posts")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    feed.textContent = "Error loading posts: " + error.message;
    return;
  }
      const { data: commentsData, error: commentsError } = await supabaseClient
  .from("comments")
  .select("id, post_id, user_id, content")
  .in("post_id", data.map(post => post.id));

if (commentsError) {
  feed.textContent = "Error loading comments: " + commentsError.message;
  return;
}
      const { data: followersData, error: followersError } = await supabaseClient
  .from("followers")
  .select("follower_id, following_id");

if (followersError) {
  feed.textContent = "Error loading followers: " + followersError.message;
  return;
}
     const userIds = [...new Set([
  ...data.map(post => post.user_id),
  ...(commentsData || []).map(comment => comment.user_id),
  ...(followersData || []).map(f => f.follower_id),
  ...(followersData || []).map(f => f.following_id)
].filter(Boolean))];

const { data: profilesData, error: profilesError } = await supabaseClient
  .from("profiles")
  .select("id, full_name, username, avatar_url")
  .in("id", userIds);

if (profilesError) {
  feed.textContent = "Error loading profiles: " + profilesError.message;
  return;
}

const profilesMap = {};

(profilesData || []).forEach(profile => {
  profilesMap[profile.id] = profile;
}); 
      const commentsMap = {};

(commentsData || []).forEach(comment => {
  if (!commentsMap[comment.post_id]) {
    commentsMap[comment.post_id] = [];
  }

  commentsMap[comment.post_id].push(comment);
});
      
      const { data: likesData, error: likesError } = await supabaseClient
  .from("likes")
  .select("post_id, user_id")
  .in("post_id", data.map(post => post.id));

if (likesError) {
  feed.textContent = "Error loading likes: " + likesError.message;
  return;
}
  feed.innerHTML = "";

  data.forEach(function(post) {
    const card = document.createElement("div");
    card.className = "post";
    
const author = document.createElement("div");

const profile = profilesMap[post.user_id];

    const avatar = document.createElement("img");

avatar.src = profile?.avatar_url ||
  "https://placehold.co/45x45/39265a/ffffff?text=TO";

avatar.alt = "Member";
avatar.style.width = "45px";
avatar.style.height = "45px";
avatar.style.borderRadius = "50%";
avatar.style.objectFit = "cover";
avatar.style.marginRight = "10px";
avatar.style.verticalAlign = "middle";

author.appendChild(avatar);

const profileLink = document.createElement("a");

profileLink.href =
  "member.html?id=" + encodeURIComponent(post.user_id);

profileLink.textContent =
  profile?.full_name || "Member";

profileLink.style.color = "#d8aaff";
profileLink.style.fontWeight = "bold";
profileLink.style.textDecoration = "none";

author.appendChild(profileLink);

const username = document.createElement("span");

username.textContent =
  " @" + (profile?.username || "user");

author.appendChild(document.createElement("br"));
author.appendChild(username);

card.appendChild(author);
    
    const followButton = document.createElement("button");

if (post.user_id !== currentUser.id) {
  const isFollowing = (followersData || []).some(f =>
    f.follower_id === currentUser.id &&
    f.following_id === post.user_id
  );

  followButton.textContent = isFollowing ? "Following" : "Follow";

  followButton.addEventListener("click", async function() {
    if (isFollowing) {
      const { error } = await supabaseClient
        .from("followers")
        .delete()
        .eq("follower_id", currentUser.id)
        .eq("following_id", post.user_id);

      if (error) {
        alert(error.message);
        return;
      }
    } else {
      const { error } = await supabaseClient
        .from("followers")
        .insert({
          follower_id: currentUser.id,
          following_id: post.user_id
        });

      if (error) {
        alert(error.message);
        return;
      }
    }

    await loadPosts();
  });

  card.appendChild(followButton);
}
    const followersCount = (followersData || []).filter(f =>
  f.following_id === post.user_id
).length;

const followingCount = (followersData || []).filter(f =>
  f.follower_id === post.user_id
).length;

const followCounts = document.createElement("p");

followCounts.textContent =
  followersCount + " Followers · " +
  followingCount + " Following";

card.appendChild(followCounts);

    const caption = document.createElement("p");
    caption.textContent = post.caption || "";
    card.appendChild(caption);

    if (post.media_url) {
      let media;

      if (post.media_type === "video") {
        media = document.createElement("video");
        media.controls = true;
        media.playsInline = true;
      } else {
        media = document.createElement("img");
        media.alt = "TAHEERAH ONE post";
      }

      media.src = post.media_url;
      card.appendChild(media);
    }

     const postLikes = likesData.filter(
  like => like.post_id === post.id
);

let userLiked = postLikes.some(
  like => like.user_id === currentUser.id
);

const likeButton = document.createElement("button");

likeButton.textContent = userLiked
  ? `❤️ Liked (${postLikes.length})`
  : `🤍 Like (${postLikes.length})`;

likeButton.addEventListener("click", async function() {

  if (userLiked) {
    const { error } = await supabaseClient
      .from("likes")
      .delete()
      .eq("post_id", post.id)
      .eq("user_id", currentUser.id);

    if (error) {
      alert(error.message);
      return;
    }

    userLiked = false;

  } else {
    const { error } = await supabaseClient
      .from("likes")
      .insert({
        post_id: post.id,
        user_id: currentUser.id
      });

    if (error) {
      alert(error.message);
      return;
    }

    userLiked = true;
  }

  const count = postLikes.length + (userLiked ? 1 : -1);

  likeButton.textContent = userLiked
    ? `❤️ Liked (${count})`
    : `🤍 Like (${count})`;

  await loadPosts();
});

card.appendChild(likeButton);
    const commentInput = document.createElement("textarea");
commentInput.placeholder = "Write a comment...";
card.appendChild(commentInput);

const sendCommentButton = document.createElement("button");
sendCommentButton.textContent = "Send";

sendCommentButton.addEventListener("click", async function() {
  const content = commentInput.value.trim();

  if (!content) {
    alert("Please write a comment.");
    return;
  }

  const { error } = await supabaseClient
    .from("comments")
    .insert({
      post_id: post.id,
      user_id: currentUser.id,
      content: content
    });

  if (error) {
    alert(error.message);
    return;
  }

  await loadPosts();
});

card.appendChild(sendCommentButton);

const postComments = commentsMap[post.id] || [];

postComments.forEach(comment => {
  const commentItem = document.createElement("p");
  const profile = profilesMap[comment.user_id];

  commentItem.textContent =
    (profile?.full_name || "Member") +
    " @" + (profile?.username || "user") +
    ": " + comment.content;

  card.appendChild(commentItem);
});
    
    feed.appendChild(card);
  });
}
    async function startApp() {
      const status = document.getElementById("status");

      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          window.location.href = "auth.html";
          return;
        }

        const user = data.session.user;
       currentUser = user; 

        const name =
          user.user_metadata.full_name || "Member";

        status.textContent =
      
          "Welcome, " + name + "! Your account is connected. 💜";
        
        await loadPosts();
        await loadStories();
        
      } catch (error) {
        status.textContent =
          "Connection error: " + error.message;
      }
    }

    document.getElementById("postButton").addEventListener("click", async function() {
  const caption = document.getElementById("caption").value.trim();
  const mediaFile = document.getElementById("postMedia").files[0];
  const message = document.getElementById("message");

  if (!currentUser) {
    message.textContent = "Please log in first.";
    return;
  }

  if (!caption && !mediaFile) {
    message.textContent = "Write something or choose a photo/video.";
    return;
  }

  message.textContent = "Publishing your post...";

        try {
    let mediaURL = null;
    let mediaType = null;

    if (mediaFile) {
      const safeName = mediaFile.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const filePath = currentUser.id + "/" + Date.now() + "-" + safeName;

      const { error: uploadError } = await supabaseClient
        .storage.from("post-media")
        .upload(filePath, mediaFile);

      if (uploadError) throw uploadError;

      const { data: urlData } = supabaseClient
        .storage.from("post-media")
        .getPublicUrl(filePath);

      mediaURL = urlData.publicUrl;
      mediaType = mediaFile.type.startsWith("video/") ? "video" : "image";
    }

    const { error } = await supabaseClient
      .from("posts")
      .insert({
        user_id: currentUser.id,
        caption: caption,
        media_url: mediaURL,
        media_type: mediaType
      });

    if (error) throw error;

    document.getElementById("caption").value = "";
    document.getElementById("postMedia").value = "";

    message.textContent = "Your post has been published! 🎉💜";

          await loadPosts();

  } catch (error) {
    message.textContent = "Error: " + error.message;
  }
});

    // TAHEERAH ONE MEMBER SEARCH

const searchInput = document.getElementById("searchMembersInput");
const searchResults = document.getElementById("memberSearchResults");

searchInput.addEventListener("input", async function() {
  const searchTerm = searchInput.value.trim();

  searchResults.innerHTML = "";

  if (searchTerm.length < 2) {
    return;
  }

  searchResults.textContent = "Searching members...";

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id, full_name, username, avatar_url")
    .or(
      `full_name.ilike.%${searchTerm}%,username.ilike.%${searchTerm}%`
    )
    .limit(20);

  if (error) {
    searchResults.textContent =
      "Search error: " + error.message;
    return;
  }

  searchResults.innerHTML = "";

  if (!data || data.length === 0) {
    searchResults.textContent = "No members found.";
    return;
  }

  data.forEach(function(member) {
    const result = document.createElement("div");

    const link = document.createElement("a");

    link.href =
      "member.html?id=" + encodeURIComponent(member.id);

    link.textContent =
      (member.full_name || "Member") +
      " @" + (member.username || "user");

    link.style.color = "#d8aaff";
    link.style.display = "block";
    link.style.padding = "10px";

    result.appendChild(link);
    searchResults.appendChild(result);
  });
});

// END MEMBER SEARCH

    startApp();
  </script>

</body>
</html>
